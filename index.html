<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #controls {
      position: fixed;
      z-index: 9999;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      background: rgba(0,0,0,0.78);
      color: white;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>


  <script>

    AFRAME.registerComponent('phone-clipper', {

      schema: {
        gain: {
          type: 'number',
          default: 1.0
        }
      },


      init: function () {

        this.enabled = false;
        this.flip = 1;

        this.baselineDistance = null;

        this.clipPlane = new THREE.Plane();

        this.localCenter = new THREE.Vector3();
        this.worldCenter = new THREE.Vector3();

        this.cameraPosition = new THREE.Vector3();
        this.viewDirection = new THREE.Vector3();

        this.planePoint = new THREE.Vector3();
        this.planeNormal = new THREE.Vector3();

        this.modelEl =
          document.querySelector('#heart');

        const scene = this.el.sceneEl;


        scene.addEventListener(
          'renderstart',
          () => {

            scene.renderer.localClippingEnabled = true;

          }
        );


        /*
          MODEL LOADED
        */

        this.modelEl.addEventListener(
          'model-loaded',
          () => {

            this.modelObject =
              this.modelEl.getObject3D('mesh');

            this.modelObject.updateMatrixWorld(true);


            /*
              Find TRUE centre of geometry
            */

            const box =
              new THREE.Box3()
                .setFromObject(this.modelObject);

            const centerWorld =
              box.getCenter(
                new THREE.Vector3()
              );


            /*
              Store centre in model-local coordinates
            */

            this.localCenter =
              this.modelObject.worldToLocal(
                centerWorld.clone()
              );


            /*
              Enable clipping capability
            */

            this.modelObject.traverse(
              (node) => {

                if (!node.isMesh) return;

                const materials =
                  Array.isArray(node.material)
                    ? node.material
                    : [node.material];

                materials.forEach(
                  (material) => {

                    material.clippingPlanes = [];

                    material.clipShadows = true;

                    material.needsUpdate = true;

                  }
                );

              }
            );


            document
              .querySelector('#status')
              .innerText =
              'Model ready';

          }
        );


        /*
          SLICE ON / OFF
        */

        window.toggleSlice = () => {

          if (!this.modelObject) return;


          if (!this.enabled) {

            /*
              When Slice turns ON:
              use current phone position as zero point
            */

            this.updatePositions();

            this.baselineDistance =
              this.cameraPosition.distanceTo(
                this.worldCenter
              );

            this.enabled = true;

          }

          else {

            this.enabled = false;

          }


          document
            .querySelector('#sliceButton')
            .innerText =
            this.enabled
              ? 'Slice ON'
              : 'Slice OFF';


          this.updateMaterials();

        };


        /*
          Flip visible half
        */

        window.flipSlice = () => {

          this.flip *= -1;

        };


        /*
          Re-zero plane at current phone position
        */

        window.resetSlice = () => {

          if (!this.enabled) return;

          this.updatePositions();

          this.baselineDistance =
            this.cameraPosition.distanceTo(
              this.worldCenter
            );

        };


        /*
          Increase sensitivity
        */

        window.moreGain = () => {

          this.data.gain += 0.25;

          this.updateStatus();

        };


        /*
          Decrease sensitivity
        */

        window.lessGain = () => {

          this.data.gain -= 0.25;

          if (this.data.gain < 0.25) {
            this.data.gain = 0.25;
          }

          this.updateStatus();

        };

      },


      /*
        Get current model centre
        and camera position
      */

      updatePositions: function () {

        this.modelObject.updateMatrixWorld(true);

        this.worldCenter
          .copy(this.localCenter);

        this.modelObject
          .localToWorld(this.worldCenter);


        this.el.object3D
          .getWorldPosition(
            this.cameraPosition
          );

      },


      /*
        Attach/remove clipping plane
      */

      updateMaterials: function () {

        if (!this.modelObject) return;

        this.modelObject.traverse(
          (node) => {

            if (!node.isMesh) return;

            const materials =
              Array.isArray(node.material)
                ? node.material
                : [node.material];

            materials.forEach(
              (material) => {

                material.clippingPlanes =
                  this.enabled
                    ? [this.clipPlane]
                    : [];

                material.needsUpdate = true;

              }
            );

          }
        );

      },


      updateStatus: function () {

        document
          .querySelector('#status')
          .innerText =
          'Slice sensitivity: ' +
          this.data.gain.toFixed(2);

      },


      /*
        Runs every frame
      */

      tick: function () {

        if (
          !this.enabled ||
          !this.modelObject ||
          this.baselineDistance === null
        ) return;


        this.updatePositions();


        /*
          Current phone-to-heart distance
        */

        const currentDistance =
          this.cameraPosition.distanceTo(
            this.worldCenter
          );


        /*
          Direction:
          phone → heart
        */

        this.viewDirection
          .subVectors(
            this.worldCenter,
            this.cameraPosition
          )
          .normalize();


        /*
          How much has the phone moved
          relative to starting position?
        */

        const movement =
          (
            this.baselineDistance -
            currentDistance
          )
          * this.data.gain;


        /*
          Plane starts at heart centre.

          Move phone closer:
          plane moves through heart.

          Move phone farther:
          plane moves opposite direction.
        */

        this.planePoint
          .copy(this.worldCenter)
          .add(
            this.viewDirection
              .clone()
              .multiplyScalar(
                movement
              )
          );


        /*
          Plane orientation follows phone view
        */

        this.planeNormal
          .copy(this.viewDirection)
          .multiplyScalar(
            this.flip
          );


        this.clipPlane
          .setFromNormalAndCoplanarPoint(
            this.planeNormal,
            this.planePoint
          );


        /*
          Debug information
        */

        document
          .querySelector('#status')
          .innerText =
          'Slice movement: ' +
          movement.toFixed(3) +
          ' | Gain: ' +
          this.data.gain.toFixed(2);

      }

    });

  </script>

</head>


<body>


  <div id="status">
    Loading model...
  </div>


  <div id="controls">

    <button
      id="sliceButton"
      onclick="toggleSlice()">
      Slice OFF
    </button>

    <button
      onclick="flipSlice()">
      Flip
    </button>

    <button
      onclick="resetSlice()">
      Reset
    </button>

    <button
      onclick="lessGain()">
      −
    </button>

    <button
      onclick="moreGain()">
      +
    </button>

  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >


    <a-assets>

      <a-asset-item
        id="heartModel"
        src="./heart.glb">
      </a-asset-item>

    </a-assets>


    <a-camera

      id="camera"

      phone-clipper="gain: 1.0"

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0">


      <a-gltf-model

        id="heart"

        src="#heartModel"

        position="0 0 0.1"

        rotation="0 0 0"

        scale="0.015 0.015 0.015">

      </a-gltf-model>


    </a-entity>


  </a-scene>

</body>
</html>
