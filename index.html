<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #controls {
      position: fixed;
      z-index: 9999;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      background: rgba(0,0,0,0.75);
      color: white;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>

  <script>
    AFRAME.registerComponent('camera-clipper', {

      schema: {
        offset: {
          type: 'number',
          default: 0
        }
      },

      init: function () {

        this.clipPlane = new THREE.Plane();

        this.enabled = false;
        this.flip = 1;

        this.cameraDirection = new THREE.Vector3();
        this.modelCenter = new THREE.Vector3();
        this.planePoint = new THREE.Vector3();

        const scene = this.el.sceneEl;
        scene.renderer.localClippingEnabled = true;

        this.modelEl = document.querySelector('#heart');

        this.modelEl.addEventListener('model-loaded', () => {

          this.modelObject = this.modelEl.getObject3D('mesh');

          this.modelObject.traverse((node) => {

            if (!node.isMesh) return;

            const materials =
              Array.isArray(node.material)
                ? node.material
                : [node.material];

            materials.forEach((material) => {

              material.clippingPlanes = [];

              material.clipShadows = true;

              material.needsUpdate = true;

            });

          });

        });

        window.toggleSlice = () => {

          this.enabled = !this.enabled;

          document.querySelector('#sliceButton').innerText =
            this.enabled ? 'Slice ON' : 'Slice OFF';

          this.updateMaterials();

        };

        window.flipSlice = () => {

          this.flip *= -1;

        };

        window.movePlaneNearer = () => {

          this.data.offset -= 0.02;
          this.updateStatus();

        };

        window.movePlaneFarther = () => {

          this.data.offset += 0.02;
          this.updateStatus();

        };

      },

      updateMaterials: function () {

        if (!this.modelObject) return;

        this.modelObject.traverse((node) => {

          if (!node.isMesh) return;

          const materials =
            Array.isArray(node.material)
              ? node.material
              : [node.material];

          materials.forEach((material) => {

            material.clippingPlanes =
              this.enabled
                ? [this.clipPlane]
                : [];

            material.needsUpdate = true;

          });

        });

      },

      updateStatus: function () {

        document.querySelector('#status').innerText =
          'Slice offset: ' +
          this.data.offset.toFixed(2);

      },

      tick: function () {

        if (!this.enabled || !this.modelObject) return;

        const camera = this.el.object3D;

        camera.getWorldDirection(this.cameraDirection);

        this.cameraDirection
          .normalize()
          .multiplyScalar(this.flip);

        this.modelEl.object3D.getWorldPosition(this.modelCenter);

        this.planePoint
          .copy(this.modelCenter)
          .add(
            this.cameraDirection
              .clone()
              .multiplyScalar(this.data.offset)
          );

        this.clipPlane.setFromNormalAndCoplanarPoint(
          this.cameraDirection,
          this.planePoint
        );

      }

    });
  </script>

</head>

<body>

  <div id="status">
    Slice offset: 0.00
  </div>

  <div id="controls">

    <button
      id="sliceButton"
      onclick="toggleSlice()">
      Slice OFF
    </button>

    <button onclick="flipSlice()">
      Flip
    </button>

    <button onclick="movePlaneNearer()">
      −
    </button>

    <button onclick="movePlaneFarther()">
      +
    </button>

  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>
      <a-asset-item
        id="heartModel"
        src="./heart.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      id="camera"
      camera-clipper="offset: 0"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="heart"
        src="#heartModel"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.015 0.015 0.015">
      </a-gltf-model>

    </a-entity>

  </a-scene>

</body>
</html>
