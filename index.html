<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #controls {
      position: fixed;
      z-index: 9999;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.78);
      color: white;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>

  <script>
    AFRAME.registerComponent('phone-clipper', {

      schema: {
        distance: {
          type: 'number',
          default: 0.20
        }
      },

      init: function () {

        this.enabled = false;
        this.flip = 1;

        this.clipPlane = new THREE.Plane();

        this.localCenter = new THREE.Vector3();
        this.worldCenter = new THREE.Vector3();

        this.cameraPosition = new THREE.Vector3();
        this.directionToHeart = new THREE.Vector3();
        this.planePoint = new THREE.Vector3();
        this.planeNormal = new THREE.Vector3();

        this.modelEl = document.querySelector('#heart');

        const scene = this.el.sceneEl;

        scene.addEventListener('renderstart', () => {
          scene.renderer.localClippingEnabled = true;
        });


        this.modelEl.addEventListener('model-loaded', () => {

          this.modelObject =
            this.modelEl.getObject3D('mesh');

          this.modelObject.updateMatrixWorld(true);

          /*
            Find true centre of actual GLB geometry
          */

          const box =
            new THREE.Box3()
              .setFromObject(this.modelObject);

          const centerWorld =
            box.getCenter(
              new THREE.Vector3()
            );

          /*
            Store centre in model-local coordinates
          */

          this.localCenter =
            this.modelObject.worldToLocal(
              centerWorld.clone()
            );


          /*
            Prepare clipping on every material
          */

          this.modelObject.traverse((node) => {

            if (!node.isMesh) return;

            const materials =
              Array.isArray(node.material)
                ? node.material
                : [node.material];

            materials.forEach((material) => {

              material.clippingPlanes = [];
              material.clipShadows = true;
              material.needsUpdate = true;

            });

          });

          document.querySelector('#status').innerText =
            'Model ready • Slice distance 20 cm';

        });


        window.toggleSlice = () => {

          if (!this.modelObject) return;

          this.enabled = !this.enabled;

          document.querySelector('#sliceButton').innerText =
            this.enabled
              ? 'Slice ON'
              : 'Slice OFF';

          this.updateMaterials();

        };


        window.flipSlice = () => {

          this.flip *= -1;

        };


        window.nearerPlane = () => {

          this.data.distance -= 0.02;

          if (this.data.distance < 0.02) {
            this.data.distance = 0.02;
          }

          this.updateStatus();

        };


        window.fartherPlane = () => {

          this.data.distance += 0.02;

          this.updateStatus();

        };

      },


      updateMaterials: function () {

        if (!this.modelObject) return;

        this.modelObject.traverse((node) => {

          if (!node.isMesh) return;

          const materials =
            Array.isArray(node.material)
              ? node.material
              : [node.material];

          materials.forEach((material) => {

            material.clippingPlanes =
              this.enabled
                ? [this.clipPlane]
                : [];

            material.needsUpdate = true;

          });

        });

      },


      updateStatus: function () {

        document.querySelector('#status').innerText =
          'Slice distance: ' +
          Math.round(this.data.distance * 100) +
          ' cm';

      },


      tick: function () {

        if (!this.enabled ||
            !this.modelObject) return;


        /*
          Get true heart centre in current AR world coordinates
        */

        this.modelObject.updateMatrixWorld(true);

        this.worldCenter
          .copy(this.localCenter);

        this.modelObject
          .localToWorld(this.worldCenter);


        /*
          Get camera world position
        */

        this.el.object3D.getWorldPosition(
          this.cameraPosition
        );


        /*
          Direction from phone/camera toward heart
        */

        this.directionToHeart
          .subVectors(
            this.worldCenter,
            this.cameraPosition
          )
          .normalize();


        /*
          Put clipping plane a fixed distance
          in front of camera
        */

        this.planePoint
          .copy(this.cameraPosition)
          .add(
            this.directionToHeart
              .clone()
              .multiplyScalar(
                this.data.distance
              )
          );


        /*
          Plane normal
        */

        this.planeNormal
          .copy(this.directionToHeart)
          .multiplyScalar(this.flip);


        /*
          Update clipping plane every frame
        */

        this.clipPlane
          .setFromNormalAndCoplanarPoint(
            this.planeNormal,
            this.planePoint
          );

      }

    });
  </script>

</head>

<body>

  <div id="status">
    Loading model...
  </div>

  <div id="controls">

    <button
      id="sliceButton"
      onclick="toggleSlice()">
      Slice OFF
    </button>

    <button
      onclick="flipSlice()">
      Flip
    </button>

    <button
      onclick="nearerPlane()">
      −
    </button>

    <button
      onclick="fartherPlane()">
      +
    </button>

  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >


    <a-assets>

      <a-asset-item
        id="heartModel"
        src="./heart.glb">
      </a-asset-item>

    </a-assets>


    <a-camera
      id="camera"
      phone-clipper="distance: 0.20"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0">


      <a-gltf-model
        id="heart"
        src="#heartModel"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.015 0.015 0.015">
      </a-gltf-model>


    </a-entity>


  </a-scene>

</body>
</html>
