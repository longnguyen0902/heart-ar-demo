<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #controls {
      position: fixed;
      z-index: 9999;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: rgba(0,0,0,0.78);
      color: white;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      white-space: nowrap;
    }
  </style>


  <script>

    AFRAME.registerComponent('phone-slicer', {

      schema: {
        gain: {
          type: 'number',
          default: 1.0
        }
      },


      init: function () {

        this.enabled = false;
        this.flip = 1;

        this.baselineDistance = null;

        this.clipPlane =
          new THREE.Plane();

        this.box =
          new THREE.Box3();

        this.center =
          new THREE.Vector3();

        this.size =
          new THREE.Vector3();

        this.cameraPosition =
          new THREE.Vector3();

        this.viewDirection =
          new THREE.Vector3();

        this.planePoint =
          new THREE.Vector3();

        this.planeNormal =
          new THREE.Vector3();

        this.modelEl =
          document.querySelector('#heart');


        const scene =
          this.el.sceneEl;


        scene.addEventListener(
          'renderstart',
          () => {

            scene.renderer.localClippingEnabled = true;

          }
        );


        /*
          MODEL LOADED
        */

        this.modelEl.addEventListener(
          'model-loaded',
          () => {

            this.modelObject =
              this.modelEl.getObject3D('mesh');


            this.modelObject.traverse(
              (node) => {

                if (!node.isMesh) return;

                const materials =
                  Array.isArray(node.material)
                    ? node.material
                    : [node.material];

                materials.forEach((material) => {

  material.clippingPlanes = [];

  material.clipShadows = true;

  material.side = THREE.DoubleSide;

  material.needsUpdate = true;

                  }
                );

              }
            );


            document
              .querySelector('#status')
              .innerText =
              'Model ready';

          }
        );


        /*
          SLICE ON/OFF
        */

        window.toggleSlice = () => {

          if (!this.modelObject) return;


          if (!this.enabled) {

            /*
              Calculate the real current
              model centre FIRST.
            */

            this.updateGeometry();


            /*
              Store starting distance
              from camera to heart.
            */

            this.baselineDistance =
              this.cameraPosition.distanceTo(
                this.center
              );


            /*
              IMPORTANT:
              initialise plane through
              centre BEFORE enabling clipping.
            */

            this.viewDirection
              .subVectors(
                this.center,
                this.cameraPosition
              )
              .normalize();


            this.planePoint
              .copy(this.center);


            this.planeNormal
              .copy(this.viewDirection)
              .multiplyScalar(this.flip);


            this.clipPlane
              .setFromNormalAndCoplanarPoint(
                this.planeNormal,
                this.planePoint
              );


            this.enabled = true;

            this.updateMaterials();

          }

          else {

            this.enabled = false;

            this.updateMaterials();

          }


          document
            .querySelector('#sliceButton')
            .innerText =
            this.enabled
              ? 'Slice ON'
              : 'Slice OFF';

        };


        window.flipSlice = () => {

          this.flip *= -1;

        };


        window.resetSlice = () => {

          if (!this.enabled) return;

          this.updateGeometry();

          this.baselineDistance =
            this.cameraPosition.distanceTo(
              this.center
            );

        };


        window.moreGain = () => {

          this.data.gain += 0.25;

        };


        window.lessGain = () => {

          this.data.gain -= 0.25;

          if (this.data.gain < 0.25) {
            this.data.gain = 0.25;
          }

        };

      },


      /*
        Recalculate actual model
        bounding box every frame.
      */

      updateGeometry: function () {

        this.modelObject.updateMatrixWorld(true);


        this.box
          .setFromObject(
            this.modelObject
          );


        this.box.getCenter(
          this.center
        );


        this.box.getSize(
          this.size
        );


        this.el.object3D.getWorldPosition(
          this.cameraPosition
        );

      },


      updateMaterials: function () {

        if (!this.modelObject) return;


        this.modelObject.traverse(
          (node) => {

            if (!node.isMesh) return;


            const materials =
              Array.isArray(node.material)
                ? node.material
                : [node.material];


            materials.forEach(
              (material) => {

                material.clippingPlanes =
                  this.enabled
                    ? [this.clipPlane]
                    : [];

                material.needsUpdate = true;

              }
            );

          }
        );

      },


      tick: function () {

        if (
          !this.enabled ||
          !this.modelObject ||
          this.baselineDistance === null
        ) {
          return;
        }


        /*
          Current real model position
        */

        this.updateGeometry();


        const currentDistance =
          this.cameraPosition.distanceTo(
            this.center
          );


        /*
          Direction from camera to heart
        */

        this.viewDirection
          .subVectors(
            this.center,
            this.cameraPosition
          )
          .normalize();


        /*
          Phone movement relative
          to position where Slice was enabled
        */

        let movement =
          (
            this.baselineDistance -
            currentDistance
          )
          * this.data.gain;


        /*
          Approximate radius of heart.
          This prevents plane from flying
          completely outside the model.
        */

        const radius =
          0.5 *
          Math.sqrt(
            this.size.x * this.size.x +
            this.size.y * this.size.y +
            this.size.z * this.size.z
          );


        /*
          Clamp cutting plane inside model
        */

        const maxMovement =
          radius * 0.90;


        movement =
          THREE.MathUtils.clamp(
            movement,
            -maxMovement,
            maxMovement
          );


        /*
          Heart centre + phone movement
        */

        this.planePoint
          .copy(this.center)
          .add(
            this.viewDirection
              .clone()
              .multiplyScalar(movement)
          );


        /*
          Plane orientation
        */

        this.planeNormal
          .copy(this.viewDirection)
          .multiplyScalar(this.flip);


        this.clipPlane
          .setFromNormalAndCoplanarPoint(
            this.planeNormal,
            this.planePoint
          );


        document
          .querySelector('#status')
          .innerText =
          'Move: ' +
          movement.toFixed(3) +
          ' | Gain: ' +
          this.data.gain.toFixed(2);

      }

    });

  </script>

</head>


<body>


  <div id="status">
    Loading model...
  </div>


  <div id="controls">

    <button
      id="sliceButton"
      onclick="toggleSlice()">
      Slice OFF
    </button>

    <button onclick="flipSlice()">
      Flip
    </button>

    <button onclick="resetSlice()">
      Reset
    </button>

    <button onclick="lessGain()">
      −
    </button>

    <button onclick="moreGain()">
      +
    </button>

  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >


    <a-assets>

      <a-asset-item
        id="heartModel"
        src="./heart.glb">
      </a-asset-item>

    </a-assets>


    <a-camera
      id="camera"
      phone-slicer="gain: 1.0"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0">


      <a-gltf-model
        id="heart"
        src="#heartModel"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.015 0.015 0.015">
      </a-gltf-model>


    </a-entity>


  </a-scene>

</body>
</html>
